# ============================================================
# 闪电侠 · Edge Function 部署（手动触发）
# 将 supabase/functions/ 下的所有 Edge Functions 部署到线上
# ============================================================
name: Deploy Edge Functions

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Supabase CLI
        run: npm install -g supabase

      - name: 部署 Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          REF=${{ secrets.SUPABASE_PROJECT_REF }}
          if [ -z "$REF" ]; then
            # 从 SUPABASE_URL 提取 project ref
            REF=$(echo "${{ secrets.SUPABASE_URL }}" | sed -E 's#^https://##; s#\.supabase\.co$##')
          fi
          echo "→ 部署到项目: $REF"
          supabase functions deploy --project-ref "$REF"
          echo "✅ Edge Functions 部署完成"
