# ============================================================
# 闪电侠 · 一次性数据库初始化（手动触发）
# 作用：在 Supabase 项目上执行 init_database.sql（建表/RPC/RLS）
#       并运行 seed.mjs（创建 admin + 30 抄表员 + 30 设备）
# 幂等：可重复点击 Run workflow，已存在则跳过。
# 触发：仓库 → Actions → “Setup Supabase DB” → Run workflow
# 前置：仓库 Settings → Secrets 配置
#        SUPABASE_URL              例：https://xxxx.supabase.co
#        SUPABASE_SERVICE_ROLE_KEY 以 sb_secret_ / eyJ 开头（务必保密）
#        SUPABASE_ACCESS_TOKEN     supabase.com → 账户 → Access Tokens 生成的账户级令牌
# 说明：建库 SQL 通过 Supabase Management API（api.supabase.com/v1/projects/{ref}/database/query）
#       执行，因为项目 API 的 /rest/v1/sql 端点未公开。种子用 service_role 经 supabase-js 执行。
# ============================================================
name: Setup Supabase DB

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 校验密钥
        run: |
          if [ -z "${{ secrets.SUPABASE_URL }}" ] || [ -z "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" ] || [ -z "${{ secrets.SUPABASE_ACCESS_TOKEN }}" ]; then
            echo "::error::缺少 Secrets：请配置 SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY / SUPABASE_ACCESS_TOKEN"
            exit 1
          fi

      - name: 执行 init_database.sql（Management API database/query）
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          REF=$(echo "$SUPABASE_URL" | sed -E 's#^https://##; s#\.supabase\.co$##')
          echo "→ project ref = $REF"
          jq -Rs '{query: .}' supabase/init_database.sql > /tmp/sql_body.json
          curl -fsS -X POST "https://api.supabase.com/v1/projects/$REF/database/query" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            --data @/tmp/sql_body.json
          echo ""
          echo "✅ init_database.sql 执行完成"

      - name: 配置 Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装依赖并运行种子
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        working-directory: supabase
        run: |
          npm install
          node seed.mjs
