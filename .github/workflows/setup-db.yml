# ============================================================
# 闪电侠 · 一次性数据库初始化（手动触发）
# 作用：在 Supabase 项目上执行 init_database.sql（建表/RPC/RLS）
#       并运行 seed.mjs（创建 admin + 30 抄表员 + 30 设备）
# 幂等：可重复点击 Run workflow，已存在则跳过。
# 触发：仓库 → Actions → “Setup Supabase DB” → Run workflow
# 前置：仓库 Settings → Secrets 配置
#        SUPABASE_URL              例：https://xxxx.supabase.co
#        SUPABASE_SERVICE_ROLE_KEY 以 sb_secret_ / eyJ 开头（务必保密）
# 为什么用 CI 执行：本地沙箱网络不通 Supabase（海外节点被拦截），
#       而 GitHub 云端运行器可正常访问，等价于在本机执行。
# ============================================================
name: Setup Supabase DB

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 校验密钥
        run: |
          if [ -z "${{ secrets.SUPABASE_URL }}" ] || [ -z "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" ]; then
            echo "::error::缺少 Secrets：请在仓库 Settings → Secrets 配置 SUPABASE_URL 与 SUPABASE_SERVICE_ROLE_KEY"
            exit 1
          fi

      - name: 执行 init_database.sql（Supabase REST SQL API）
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          jq -Rs '{query: .}' supabase/init_database.sql > /tmp/sql_body.json
          echo "→ POST init_database.sql"
          curl -fsS -X POST "$SUPABASE_URL/rest/v1/sql" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            -H "Content-Type: application/json" \
            --data @/tmp/sql_body.json
          echo ""
          echo "✅ init_database.sql 执行完成"

      - name: 配置 Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装依赖并运行种子
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        working-directory: supabase
        run: |
          npm install
          node seed.mjs
