name: DNS Diagnostic
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: 解析对比
        run: |
          for h in supabase.co api.supabase.com ikdpglqstdywiiitfmz.supabase.co; do
            echo "=== $h ==="
            python3 - <<PY
import socket
h="$h"
try:
    print("resolved ->", socket.gethostbyname(h))
except Exception as e:
    print("RESOLVE FAILED:", type(e).__name__, e)
PY
          done
